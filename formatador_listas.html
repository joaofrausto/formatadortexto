<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formatador de Listas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: uma coluna só — entrada, botões de formato, resultado */
:root{
  --bg:#f6f5f2; --panel:#ffffff; --ink:#1d1f1e; --muted:#6a6f6b; --line:#e2e0da;
  --accent:#e2462c; --accent-ink:#ffffff;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141615; --panel:#1c1f1e; --ink:#ecebe7; --muted:#9a9f9b; --line:#2e3230;
  --accent:#ff6a4d; --accent-ink:#1a0d09; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141615; --panel:#1c1f1e; --ink:#ecebe7; --muted:#9a9f9b; --line:#2e3230;
  --accent:#ff6a4d; --accent-ink:#1a0d09; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px}
.wrap{max-width:720px;margin:0 auto;padding-block:28px 40px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:flex;flex-direction:column;gap:14px}
h1{font-size:20px;font-weight:600;margin:0}
textarea{width:100%;resize:vertical;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);
  font-family:var(--f-mono);font-size:13px;line-height:1.5;padding:12px}
#entrada{min-height:170px}
#saida{min-height:110px}
textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.formatos{display:flex;flex-wrap:wrap;gap:8px}
.fmt{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--ink);
  padding:8px 12px;border-radius:8px;cursor:pointer}
.fmt:hover{border-color:var(--accent)}
.fmt[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.barra{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.barra label{display:flex;gap:6px;align-items:center;cursor:pointer;color:var(--muted)}
input[type=checkbox]{accent-color:var(--accent)}
.concat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.concat{grid-template-columns:1fr}}
.concat label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);min-width:0}
.concat input{font-family:var(--f-mono);font-size:13px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
.concat input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.rotulo{font-size:12px;color:var(--muted);margin-bottom:-6px}
.info{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.acoes{display:flex;gap:8px;flex-wrap:wrap}
.acao{font:inherit;font-size:14px;font-weight:500;border:1px solid var(--line);background:var(--panel);color:var(--ink);
  padding:10px 16px;border-radius:8px;cursor:pointer}
.acao:hover{border-color:var(--ink)}
.acao[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.acao[aria-pressed="true"]::before{content:"✓ "}
.copiar{font:inherit;font-weight:600;font-size:14px;border:0;background:var(--accent);color:var(--accent-ink);
  padding:10px 20px;border-radius:8px;cursor:pointer}
</style>
</head>
<body>

<div class="wrap">
  <h1>Formatador de Listas</h1>

  <textarea id="entrada" spellcheck="false" placeholder="Cole aqui (um item por linha, ou separado por vírgula / ; / tab)"></textarea>

  <div class="concat">
    <label for="prefixo">Colocar antes de cada item
      <input type="text" id="prefixo" placeholder="ex: panvel_" spellcheck="false">
    </label>
    <label for="sufixo">Colocar depois de cada item
      <input type="text" id="sufixo" placeholder="ex: _sp" spellcheck="false">
    </label>
  </div>

  <span class="rotulo">Como retornar</span>
  <div class="formatos" id="formatos"></div>

  <span class="info" id="info"></span>

  <textarea id="saida" spellcheck="false" readonly></textarea>

  <div class="acoes">
    <button class="copiar" id="copiar" type="button">Copiar tudo</button>
    <button class="acao" id="dedupe" type="button" aria-pressed="false">Remover duplicados</button>
    <button class="acao" id="limpar" type="button">Limpar</button>
  </div>
</div>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const FORMATOS=[
    {nome:"a,b,c",          f:l=>l.join(",")},
    {nome:"a, b, c",        f:l=>l.join(", ")},
    {nome:"'a','b','c'",    f:l=>l.map(s=>`'${s}'`).join(",")},
    {nome:"('a', 'b') SQL", f:l=>"("+l.map(s=>`'${s}'`).join(", ")+")"},
    {nome:"('a','b') SQL",  f:l=>"("+l.map(s=>`'${s}'`).join(",")+")"},
    {nome:"(1, 2) SQL",     f:l=>"("+l.join(", ")+")"},
    {nome:"(1,2) SQL",      f:l=>"("+l.join(",")+")"},
    {nome:"'a', 'b', 'c'",  f:l=>l.map(s=>`'${s}'`).join(", ")},
    {nome:"a;b;c",          f:l=>l.join(";")},
    {nome:"a; b; c",        f:l=>l.join("; ")},
    {nome:"a b c",          f:l=>l.join(" ")},
    {nome:"Uma por linha",  f:l=>l.join("\n")},
    {nome:"Concatenar",     f:l=>l.join("")}
  ];
  let atual=1, dedupe=false;
  try{ const s=parseInt(localStorage.getItem("fmtAtual")); if(s>=0&&s<FORMATOS.length) atual=s; }catch(e){}

  const box=$("formatos");
  FORMATOS.forEach((fm,i)=>{
    const b=document.createElement("button");
    b.type="button"; b.className="fmt"; b.textContent=fm.nome;
    b.addEventListener("click",()=>{ atual=i; try{localStorage.setItem("fmtAtual",i)}catch(e){} run(); });
    box.appendChild(b);
  });

  function run(){
    let l=$("entrada").value.split(/\r?\n|\t|;|,/).map(s=>s.trim().replace(/^["']+|["']+$/g,"")).filter(Boolean);
    const total=l.length;
    if(dedupe) l=[...new Set(l)];
    const pre=$("prefixo").value, suf=$("sufixo").value;
    if(pre||suf) l=l.map(s=>pre+s+suf);
    $("dedupe").setAttribute("aria-pressed",dedupe?"true":"false");
    $("saida").value=l.length?FORMATOS[atual].f(l):"";
    const rem=total-l.length;
    $("info").textContent=l.length?`${l.length} itens`+(rem?` · ${rem} duplicados removidos`:""):"";
    box.querySelectorAll(".fmt").forEach((b,i)=>b.setAttribute("aria-pressed",i===atual?"true":"false"));
  }

  $("copiar").addEventListener("click",()=>{
    const v=$("saida").value, btn=$("copiar");
    const ok=()=>{ btn.textContent="Copiado ✓"; setTimeout(()=>btn.textContent="Copiar tudo",1400); };
    const fb=()=>{ $("saida").select(); try{document.execCommand("copy"); ok();}catch(e){ btn.textContent="Use Ctrl+C"; } };
    if(!v) return;
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(v).then(ok).catch(fb); else fb();
  });
  $("entrada").addEventListener("input",run);
  $("prefixo").addEventListener("input",run);
  $("sufixo").addEventListener("input",run);
  $("dedupe").addEventListener("click",()=>{ dedupe=!dedupe; run(); });
  $("limpar").addEventListener("click",()=>{ $("entrada").value=""; $("prefixo").value=""; $("sufixo").value=""; run(); $("entrada").focus(); });

  run();
})();
</script>
</body>
</html>
